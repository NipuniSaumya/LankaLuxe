<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"content="width=device-width,initial-scal=1.0">
        <title>LankaLuxe | Explore Sri Lanka</title>
        <link rel="preconnect" href="http://fonts.googleapis.com">
        <link rel="preconnect" href="http://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="navbar">
            <a href="#" class="logo">
                <span>🌴</span>
                <div>
                    <strong>LankaLuxe</strong>
                    <small>EXPLORE SRI LANKA</small>
                </div>
            </a>
            <nav>
                <a href="#" class="active">Home</a>
                <a href="#places">Places</a>
                <a href="#categories">Categories</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
            <div class="nav-right">
                <button class="fav-btn">
                    ❤️<span>My Favourites</span>
                </button>
                <button class="search-icon">🔎
                </button>
            </div>
        </header>
        <section class="hero">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <p class="script">
                    Welcome to Sri Lanka</p>
                    <h1> Discover the Beauty of <br> <span>Sri Lanka</span></h1>
                    <p class="hero-text">From misty mountains to golden beaches,ancient cities to <br> wildlife adventure - Sri Lanka has it all</p>
                    <a href="#places" class="main-btn">Explore Places <span>➡️</span></a>
            </div>
            <div class="hero-tag">
                <div>❤️</div>
                <p>
                    Small Island
                    <br>
                    <strong> Big Magic</strong>
                </p>
            </div>
            <div class="search-box">
                <div class="search-field">
                    <span>🔎</span>
                    <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for Places..">
                </div>
                <select id="categorySelect">

                <option value="all">
                    All Categories
                </option>

                <option value="mountains">
                    Mountains
                </option>

                <option value="beaches">
                    Beaches
                </option>

                <option value="historical">
                    Historical Places
                </option>

                <option value="nature">
                    Waterfalls & Nature
                </option>

                <option value="wildlife">
                    Wildlife
                </option>

                <option value="cultural">
                    Cultural Places
                </option>
            </select>
            <button id="searchBtn">
                Search
            </button>
            </div>
        </section>
        
    </body>
</html>
